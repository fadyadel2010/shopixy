module:
  module_name: "Chart of Accounts"
  domain: "Accounting / POS Admin Backend"
  page_name: "NOT IMPLEMENTED - no POS-Admin Chart of Accounts UI exists"
  business_entity: "Account (table LedgerAccounts) + JournalEntry + LedgerEntry"

business_rules:
  - "Account Code is immutable after creation."
  - "Account Type is immutable after creation."
  - "Ledger owns financial truth; Account.CurrentBalance is only a denormalized cache."
  - "CurrentBalance must always equal the sum of LedgerEntry rows."
  - "System accounts (IsSystem) cannot be deleted or renamed."
  - "Journal must always balance (total debits == total credits)."
  - "Journal must have at least 2 lines."
  - "Each ledger line must have exactly one side (debit or credit) greater than zero."
  - "All amounts must be positive."
  - "Account must be active (IsActive) before it can receive a posting."
  - "PreventNegative accounts cannot go below zero; projected balance is checked pre-commit."
  - "Treasury inflow requires certified source authority (SalesInvoice completed+paid, Order collected/settled, settlement batch, refund, payout, etc.)."
  - "Treasury outflow requires certified source authority (PurchaseInvoice, SupplierPayment, Return, Expense, Order_Refund, CommerceHub transaction, AffiliateCommissionPaid, Reversal)."
  - "Manual clearing settlement is disabled; must use certified settlement workflow."
  - "Cross-tenant isolation is enforced; TenantId filters every query."
  - "Chart of Accounts is seed-based; canonical LedgerAccounts are backend-managed, not user-created."
  - "Idempotency key is required and unique per posting; re-posting with the same key returns the original journal."
  - "Journal is immutable; status transitions only Posted -> Reversed."
  - "Account Code is unique per tenant (TenantId, AccountCode)."
  - "Self-referencing delete is restricted (parent with children cannot be cascade-deleted)."
  - "Financial statements are recomputed from LedgerEntries on every request; no projection store."

preconditions:
  - "Valid Tenant exists."
  - "X-Tenant-Id header is set (RequiredTenantId enforced)."
  - "Admin role required for the seed endpoint (POST /api/admin/accounting/seed)."
  - "Chart of Accounts already seeded (accounts with codes 1000..6130 present)."
  - "Required system accounts exist (Cashbox 1010, Bank 1030, Visa Clearing 1110, Supplier Payables 2010, POS Sales 4010, COGS 5010, Opening Balance Equity 3010, etc.)."
  - "Account exists and is active before it is referenced in a posting."
  - "Posting request is balanced (debits == credits) with >= 2 lines."
  - "Idempotency key provided for any posting."
  - "Treasury authority satisfied for any cash in/out movement."

user_journey:
  - "Seed Chart of Accounts: POST /api/admin/accounting/seed -> 200."
  - "View Trial Balance: GET /api/financialreports/trial-balance?from=&to=."
  - "View Balance Sheet: GET /api/financialreports/balance-sheet?asOf=."
  - "View Profit & Loss: GET /api/financialreports/profit-loss?from=&to=."
  - "View Cash Flow: GET /api/financialreports/cash-flow?from=&to=."
  - "View Clearing Aging: GET /api/financialreports/clearing-aging."
  - "View Dashboard: GET /api/financialreports/dashboard."
  - "Re-seed idempotently: POST /api/admin/accounting/seed again -> no duplicate accounts."

expected_runtime_after_success:
  - "Chart of Accounts seeded; system accounts created with IsSystem=true."
  - "Hierarchy established (e.g. Cashbox Main 1010 parent = Cash and Bank 1000; Visa Clearing 1110 parent = Clearing Accounts 1100)."
  - "Trial Balance is balanced (variance 0)."
  - "Balance Sheet balances (TotalAssets == TotalLiabilities + TotalEquity)."
  - "Profit & Loss totals calculated (GrossProfit == Revenue - COGS; NetProfit == GrossProfit - Expenses)."
  - "Clearing report lists clearing accounts with age buckets; TotalPending matches sum of IsClearing balances."
  - "Dashboard loads with metrics consistent with P&L + BalanceSheet + ClearingAging."
  - "Ledger balances updated after postings (CurrentBalance tracks LedgerEntries)."
  - "Reports reflect current ledger state (recomputed per request)."

browser_assertions:
  - "Seed endpoint returns 200 with message 'Chart of accounts seeded successfully'."
  - "Required system accounts exist per tenant (codes 1000,1010,1020,1030,1110,1120,1130,1140,1310,1410,2010,2020,2030,2040,2105,3010,4010,4020,4030,5010,6010,6020,6030,6100,6110,6120,6130)."
  - "IsSystem=true for all seeded template accounts."
  - "PreventNegative=true for accounts 1010,1030,1040,2105,2040."
  - "IsClearing=true for accounts 1110,1120,1130,1140."
  - "Cashbox Main (1010) ParentAccountId resolves to Cash and Bank (1000)."
  - "Visa Clearing (1110) ParentAccountId resolves to Clearing Accounts (1100)."
  - "Trial Balance IsBalanced == true for any posted period."
  - "Balance Sheet IsBalanced == true and TotalAssets == TotalLiabilities + TotalEquity."
  - "Profit & Loss GrossProfit == Revenue - COGS and NetProfit == GrossProfit - Expenses."
  - "Clearing report contains expected clearing accounts with non-negative TotalPending."
  - "Dashboard loads successfully and reports consistent aggregates."
  - "Re-seeding does not change LedgerAccounts count (idempotent)."
  - "Cross-tenant request never returns another tenant's LedgerAccounts."

negative_tests:
  - "Seed Chart twice: second POST /api/admin/accounting/seed must not create duplicate accounts; LedgerAccounts count stable; unique index not violated."
  - "Manual clearing settlement: POST /api/admin/accounting/treasury/settle returns 410 Gone (SETTLEMENT_AUTHORITY_REQUIRED)."
  - "Cross-tenant access: a request with Tenant A's X-Tenant-Id must never read or return Tenant B's LedgerAccounts/statements."
  - "Posting to inactive account: deactivated account rejected with InactiveAccountException (engine/integration level; no UI toggle exists)."
  - "Negative balance on PreventNegative account: treasury outflow exceeding cashbox balance rejected with InsufficientFundsException."
  - "Unbalanced journal: posting with debits != credits rejected with UnbalancedJournalException (engine/integration level)."
  - "Missing idempotency key: posting rejected during validation."
  - "Unauthorized treasury operation: clearing settlement via manual endpoint rejected (410)."

critical_invariants:
  - "Ledger owns financial truth; Account.CurrentBalance is only a cache."
  - "Account Code never changes after creation."
  - "Account Type never changes after creation."
  - "CurrentBalance must always equal the sum of LedgerEntry rows."
  - "Journal must balance (debits == credits)."
  - "Double-entry accounting preserved (every debit has a matching credit)."
  - "System accounts protected from delete/rename."
  - "Posting engine (FinancialPostingService) is the only balance writer."
  - "Financial statements derive exclusively from LedgerEntries."
  - "Tenant isolation always enforced."
  - "Journal immutable; only Posted -> Reversed transition allowed."
  - "Idempotency guaranteed: same idempotency key never produces a second journal."
  - "Seeding is idempotent; re-seed never duplicates accounts."

not_implemented:
  - "No CRUD API / POS-Admin UI for canonical LedgerAccounts (create/edit/delete/re-parent/toggle-active). Do NOT generate browser scenarios for these."
  - "No Account Delete for canonical Account."
  - "No Account Re-parenting / Move for canonical Account."
  - "No Retained Earnings account."
  - "No Period Closing / net-profit roll-forward."
  - "No Chart of Accounts management UI."
  - "No soft-delete/archive state for canonical accounts."
  - "Cash Flow InvestingActivities and FinancingActivities are empty (partial)."
  - "Legacy FinancialAccount / FinancialTransactions shadow model is deprecated; not authoritative and not to be confused with the ledger."

browser_test_scenarios:
  - "Seed Chart of Accounts: POST /api/admin/accounting/seed, assert 200 and system accounts present."
  - "Verify idempotent seeding: seed twice, assert LedgerAccounts count unchanged and no duplicate codes."
  - "Verify hierarchy: assert 1010 parent = 1000 and 1110 parent = 1100."
  - "Verify system flags: assert IsSystem/IsClearing/PreventNegative flags on seeded accounts."
  - "View Trial Balance: GET trial-balance, assert IsBalanced == true."
  - "View Balance Sheet: GET balance-sheet, assert TotalAssets == TotalLiabilities + TotalEquity and IsBalanced."
  - "View Profit & Loss: GET profit-loss, assert GrossProfit and NetProfit formulas hold."
  - "View Cash Flow: GET cash-flow, assert report generated (note Investing/Financing sections empty)."
  - "View Clearing Aging: GET clearing-aging, assert clearing accounts listed with TotalPending."
  - "Verify Dashboard: GET dashboard, assert metrics consistent with P&L + BalanceSheet + ClearingAging."
  - "Verify financial consistency: Trial Balance, Balance Sheet, and P&L all agree (ledger is single source)."
  - "Cross-tenant isolation: assert one tenant's X-Tenant-Id never exposes another tenant's accounts/statements."
  - "Manual clearing settlement rejected: POST treasury/settle returns 410 Gone."

success_definition:
  - "Business Rules hold (immutable code/type, balanced journals, active-account-before-posting, PreventNegative enforcement, treasury authority, cross-tenant isolation, seed-based CoA)."
  - "Browser assertions succeed (seed 200, system accounts exist, Trial Balance balanced, Balance Sheet balanced, P&L totals correct, Clearing report generated, Dashboard loads)."
  - "Critical invariants remain intact (ledger owns truth, CurrentBalance is cache, code/type immutable, double-entry preserved, journal immutable, idempotency, tenant isolation)."
  - "Financial statements are internally consistent and derive from LedgerEntries."
  - "Ledger remains the financial authority; reports reflect current ledger state."
  - "Double-entry accounting is never violated."
  - "Runtime expectations succeed (seeded CoA, updated ledger balances, generated statements, refreshed dashboard)."
