module:
  module_name: "Treasury (POS Admin)"
  domain: "Accounting / Treasury"
  page_name: "Treasury (POS Admin)"
  business_entity:
    - "TreasuryAccount"
    - "Cashbox"
  frontend_surface: "PointOfSale.Web/src/services/treasuryApi.js"
  api_base: "/api/treasury"

business_rules:
  - "Treasury is NOT the financial source of truth."
  - "Ledger owns financial truth."
  - "TreasuryAccount is a mapping to a Ledger Account."
  - "Treasury only routes internal money movement."
  - "Cashboxes map to dedicated GL accounts (1010-<guid>)."
  - "Treasury never creates or destroys money."
  - "Cash In is disabled (HTTP 410 Gone)."
  - "Cash Out is disabled (service throws)."
  - "Direct Expense posting is disabled (service throws)."
  - "Manual Clearing Settlement is disabled (HTTP 410 Gone)."
  - "PreventNegative validation enforced (InsufficientFundsException)."
  - "Treasury requires certified financial authority (inflow/outflow)."
  - "Cross-tenant isolation enforced."
  - "Treasury balances are derived from Ledger Accounts (Account.CurrentBalance)."
  - "Amount must be positive."
  - "Source account must differ from target account."
  - "Both endpoints must be active same-tenant Cashbox/Bank treasury accounts with active Asset backing."
  - "Transfer type restriction: Cashbox/Bank only."
  - "Settlement type restriction: Clearing source to Bank destination only."
  - "Bank deposit type restriction: Cashbox source to Bank destination only."
  - "Inactive accounts reject new entries."
  - "Cashboxes open with ZERO new cash only."
  - "Idempotency keys enforced (re-checked inside posting transaction)."
  - "Legacy write-block (CashboxTransactions/VisaTransactions) is conditional (LCR_ENFORCEMENT_ENABLED default false)."

preconditions:
  - "Valid Tenant (ITenantContext.RequiredTenantId)."
  - "Required permissions: Owner, Admin, or Manager role."
  - "Treasury Account exists and is active."
  - "Backing Ledger Account exists and is active Asset type."
  - "Treasury mapping (TreasuryAccount row) exists."
  - "Posting Request is valid (balanced 2-line journal)."
  - "Amount is positive."
  - "Source and destination accounts differ."
  - "Treasury account types are compatible for the operation."
  - "Certified financial authority exists for any cashbox/bank balance change."
  - "Required system accounts already seeded (1010, 1030, 1110, 1120, 1130, 1140)."
  - "OperationId provided for replay-safe mutations."

user_journey:
  - "View Treasury Dashboard"
  - "View Treasury Accounts"
  - "View Treasury Balances"
  - "View Treasury Movements"
  - "Transfer Between Treasury Accounts"
  - "Deposit Cashbox to Bank"
  - "Withdraw Bank to Cashbox"
  - "View Clearing Accounts"
  - "Open Cashbox (zero float only)"

expected_runtime_after_success:
  - "Treasury movement completed."
  - "Balanced Journal created (SourceType TreasuryDeposit/TreasuryWithdraw/TreasuryTransfer/BankDeposit/ClearingSettlement)."
  - "Ledger updated (JournalEntry + LedgerEntry + Account.CurrentBalance)."
  - "Treasury balances refreshed."
  - "Dashboard reflects latest balances."
  - "Treasury movements appear."
  - "Clearing balances updated (settlement engine only)."
  - "Bank balances updated."
  - "Cashbox balances updated."
  - "Journal number returned to caller."

browser_assertions:
  - "Dashboard loads successfully with cashboxBalance, bankBalance, totalCashAndBank, revenue, expenses, netProfit, clearingAccounts, totalPendingClearing."
  - "Treasury accounts listed with accountType, isClearing, preventNegative."
  - "Treasury balances displayed for account codes (e.g. 1010, 1030, 1110)."
  - "Treasury movements listed with debit, credit, balanceAfter, sourceType."
  - "Deposit succeeds and returns success=true, journalId, journalNumber."
  - "Withdraw succeeds and returns success=true, journalId, journalNumber."
  - "Transfer succeeds and returns success=true, journalId, journalNumber."
  - "Clearing accounts displayed with accountCode, name, balance, sourceType, sourceCode."
  - "Journal number returned on every successful operation."
  - "Treasury balances reconcile with Ledger (GET balance == Ledger Account.CurrentBalance)."
  - "Cashbox opens only with zero opening float."

negative_tests:
  - "Transfer to same account -> 400 (Source and destination treasury accounts must be different)."
  - "Zero amount -> 400 (Amount must be positive)."
  - "Negative amount -> 400 (Amount must be positive)."
  - "Inactive Treasury Account -> 400 (TreasuryValidationException)."
  - "Invalid Treasury Type (e.g. Clearing as transfer source) -> 400 (type restriction)."
  - "Cross-tenant access -> rejected by RequiredTenantId isolation."
  - "Insufficient funds (PreventNegative) -> 400 (InsufficientFundsException)."
  - "Cash In attempt -> 410 Gone (TREASURY_INFLOW_WORKFLOW_REQUIRED)."
  - "Cash Out attempt -> 400 (Direct treasury cash-out is disabled)."
  - "Direct Expense attempt -> 400 (Direct treasury expense posting is disabled)."
  - "Manual Settlement attempt -> 410 Gone (SETTLEMENT_AUTHORITY_REQUIRED)."
  - "Invalid treasury authority (uncertified source) -> rejected by FinancialPostingService validators."
  - "Invalid account mapping (non-Cashbox/Bank code) -> 400 (requires active same-tenant cashbox or bank treasury account authority)."
  - "Duplicate idempotency key (replay) -> no double-post; balance unchanged on second call."
  - "Non-zero cashbox opening float -> 400 (OPENING_FLOAT_TRANSFER_REQUIRED)."
  - "Role gate: non Owner/Admin/Manager (e.g. Cashier) -> 403."

critical_invariants:
  - "Ledger owns financial truth."
  - "Treasury never owns balances (TreasuryAccount.CurrentBalance is pass-through to Account)."
  - "TreasuryAccount maps to Ledger Account."
  - "Treasury never creates money."
  - "Treasury never destroys money."
  - "Posting Engine (FinancialPostingService) is the only Ledger writer."
  - "PreventNegative is enforced."
  - "Treasury movement always generates balanced journals."
  - "Certified financial authority always required for cashbox/bank changes."
  - "Treasury balances always reconcile with Ledger."
  - "Tenant isolation always enforced."
  - "Treasury emits no domain events and no outbox messages."

browser_test_scenarios:
  - "View Dashboard"
  - "View Treasury Accounts"
  - "View Balances"
  - "View Movements"
  - "Deposit Cashbox to Bank"
  - "Withdraw Bank to Cashbox"
  - "Transfer Between Treasury Accounts"
  - "Verify Dashboard refresh"
  - "Verify Ledger reconciliation"
  - "Verify PreventNegative"
  - "Verify Idempotency"
  - "Verify Cross-Tenant Isolation"
  - "Open Cashbox (zero float)"

not_implemented:
  - "Cash In (disabled / 410 Gone)"
  - "Cash Out (disabled / throws)"
  - "Direct Expense Posting (disabled / throws)"
  - "Manual Clearing Settlement (disabled / 410 Gone)"
  - "Treasury-owned Financial Truth"
  - "Treasury Outbox"
  - "Treasury Domain Events"
  - "Treasury-owned Ledger"
  - "Currency Management on Treasury"
  - "Treasury Approval Workflow"
  - "Treasury Delete (hard delete forbidden; soft delete only)"
  - "PhaseTOJ_BlockLegacyTreasuryWrites.sql trigger (does not exist)"

success_definition:
  - "Business Rules hold."
  - "Browser assertions succeed."
  - "Critical invariants remain intact."
  - "Treasury balances reconcile with Ledger."
  - "Treasury never becomes the financial authority."
  - "Posting Engine remains the only Ledger writer."
  - "Internal money movement remains balanced."
  - "Runtime expectations succeed."

runtime_model:
  - "Treasury"
  - "Movement Router"
  - "Posting Request"
  - "Financial Posting Service"
  - "General Ledger"
  - "Treasury Read Models"
