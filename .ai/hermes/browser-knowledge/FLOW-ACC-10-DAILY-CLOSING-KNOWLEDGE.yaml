    - Browser
    - DailyCloseReport
    - Printable Z Report

modeling_directives:
  - Never treat Cashbox as the financial source of truth.
  - Never treat Cash Difference as a financial adjustment.
  - Never treat Closing as a Journal Posting.
  - Never treat Daily Closing as a Financial Posting workflow.
  - Always treat General Ledger as the financial truth.
  - Always treat Daily Close Report as a CQRS read projection.
  - Always treat Cashbox Closing as an operational workflow.
  - Always treat Cash Difference as an audit record only.
  - Do NOT generate browser tests for capabilities marked NOT IMPLEMENTED.
