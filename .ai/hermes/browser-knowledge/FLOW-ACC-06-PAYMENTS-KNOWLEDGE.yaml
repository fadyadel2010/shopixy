# FLOW-ACC-06 — Payments (POS Admin) — Browser Knowledge
# Source of truth: .ai/hermes/accounts/FLOW-ACC-06-PAYMENTS.md (implementation-backed)
# Every list-item string is DOUBLE-QUOTED so embedded colons (error strings) never break YAML.

module:
  module_name: "PointOfSale (POS Admin) — ERP Payments"
  workflow_name: "FLOW-ACC-06 Payments"
  business_entity: "SupplierPayment, PartyLedgerAdjustment, AccountLedger (party sub-ledger), CustomerTransaction/SupplierTransaction, Statement Of Account (read model), Outstanding Balance (read model)"
  domain: "Accounting / ERP Party Payments (Customer Payments, Supplier Payments, Party Ledger, Financial Posting)"
  covered_entities:
    - "Supplier Payment (standalone entity + table SupplierPayments)"
    - "Customer Payment (inline-at-sale only; no standalone entity/API)"
    - "Party Ledger Adjustment (CreditNote/DebitNote/CreditAdjustment/DebitAdjustment)"
    - "Statement Of Account (read model over AccountLedgers)"
    - "Outstanding Balance (read model over AccountLedgers)"

business_rules:
  - "No unified Payment aggregate or PaymentService exists; payments are three separate paths."
  - "Supplier Payment is the ONLY standalone party-payment entity (table SupplierPayments)."
  - "Customer Payment is created inline during Sale invoice creation as a PaymentReceived ledger credit."
  - "Customer Payment has NO standalone API endpoint."
  - "Customer Payment has NO standalone entity (no CustomerPayment table)."
  - "Supplier Payment writes the party sub-ledger (AccountLedgers) via LedgerService as TransactionType.PaymentMade (debit reduces payable)."
  - "Supplier Payment enqueues an AccountingOutboxMessage inside the same DB transaction."
  - "Supplier Payment posts to the General Ledger asynchronously through CommerceAccountingService then FinancialPostingService."
  - "Supplier Payment journal posts: Debit SupplierPayables (2010), Credit funding account (Cash->cashbox, Card->VisaClearing 1110, BankTransfer->BankAccount 1030)."
  - "Statement Of Account is a read model; it owns no balances."
  - "Outstanding Balance is a read model computed as sum(DebitAmount - CreditAmount) per party, filtered balance != 0."
  - "Party Balance (Customer.Balance / Supplier.Balance) is a rebuildable cache, not financial truth."
  - "General Ledger (JournalEntries/LedgerEntries/LedgerAccounts) owns financial truth."
  - "Supplier Payments are account-level only; PurchaseInvoiceId is always null in the implemented path."
  - "Invoice-level payment allocation is NOT IMPLEMENTED for party payments."
  - "Party-payment Settlement is NOT IMPLEMENTED."
  - "Party-payment records are create-only (effectively immutable); no update/delete/reverse/void endpoints."
  - "Idempotency is required on Supplier Payment (Idempotency-Key header) and enforced by unique index IX_SupplierPayments_TenantId_IdempotencyKey."
  - "GL journals are idempotent on (TenantId, IdempotencyKey) and must balance (debits == credits)."
  - "Tenant isolation is enforced (TenantId NOT NULL, RequiredTenantId, global query filters)."
  - "Supplier Payment funding method must be concrete (Cash, Card, BankTransfer); Credit and Mixed are rejected."
  - "Overpayment is NOT validated (no cap against invoice or balance)."
  - "Multiple payments are supported and additive on the running balance."

preconditions:
  - "Authenticated operator JWT for the tenant."
  - "Authorized role for Supplier Payment: Owner, Admin, or Manager."
  - "Valid resolved Tenant (X-Tenant-Id)."
  - "Existing, non-deleted Supplier (for supplier payment) or Customer/Supplier party (for adjustment)."
  - "Positive Amount (> 0)."
  - "Concrete Payment Method (Cash, Card, or BankTransfer) for supplier payment."
  - "Active funding account for the chosen method."
  - "Sufficient funds in the funding account (balance >= amount)."
  - "Configured cashbox when paying by Cash."
  - "Valid Idempotency-Key header (^[A-Za-z0-9-]+$, <= 100 chars) for supplier payment and adjustment."

user_journey:
  supplier_payment:
    - "Open Supplier detail / payment form for an existing supplier."
    - "Enter Amount (> 0) and select Payment Method (Cash, Card, or BankTransfer)."
    - "Provide Reference Number (optional; defaults to SPAY-{timestamp}) and Notes (optional)."
    - "Provide Idempotency-Key header."
    - "Submit POST /suppliers/{id}/payments."
    - "Receive 201 Created + SupplierPaymentResponse with BalanceAfter."
  customer_payment:
    - "Open POS Sale (new sale invoice) screen."
    - "Add line items and choose a paid method (Cash/Card/Mixed) at checkout."
    - "Submit POST /sales."
    - "Sale completes; a PaymentReceived ledger credit is recorded inline (no separate payment screen)."
  party_ledger_adjustment:
    - "Open Statement Of Account and choose Create Adjustment."
    - "Select PartyType (Customer/Supplier), party, AdjustmentType (CreditNote/DebitNote/CreditAdjustment/DebitAdjustment), Amount, Reference, Notes."
    - "Provide Idempotency-Key header."
    - "Submit POST /StatementOfAccount/adjustment."
    - "Receive 200/201 + PartyLedgerAdjustmentResponse with BalanceAfter."
  statement_of_account:
    - "Open Statement Of Account page."
    - "Select PartyType, Party, and date range; submit POST /StatementOfAccount/query."
    - "View opening balance, transactions, running balance, and summary."
  outstanding_balance:
    - "Open Outstanding Balances page."
    - "Select PartyType (Customer/Supplier); GET /StatementOfAccount/outstanding/{partyType}."
    - "View parties with non-zero balances and totals."

expected_runtime_after_success:
  supplier_payment:
    - "SupplierPayment row created."
    - "Party sub-ledger (AccountLedgers) updated with a PaymentMade entry."
    - "Supplier Balance cache updated (reduced by amount)."
    - "SupplierTransaction row created with BalanceAfter."
    - "AccountingOutboxMessage of type SupplierPayment enqueued (same transaction)."
    - "JournalEntry eventually created (SourceType=SupplierPayment) via FinancialPostingService."
    - "General Ledger updated (Dr SupplierPayables 2010 / Cr funding account)."
    - "Statement Of Account reflects the new transaction."
    - "Outstanding Balance reflects the reduced balance."
  customer_payment:
    - "Sale invoice completed."
    - "PaymentReceived ledger entry created (credit) in AccountLedgers."
    - "Customer Balance cache updated."
    - "CustomerTransaction row created."
    - "No standalone CustomerPayment entity created."
    - "No standalone CustomerPayment API involved."
  party_ledger_adjustment:
    - "PartyLedgerAdjustment row created."
    - "Party sub-ledger (AccountLedgers) updated."
    - "Customer/Supplier Transaction row created with BalanceAfter."
    - "AccountingOutboxMessage of type PartyLedgerAdjustment enqueued."
    - "JournalEntry eventually created; General Ledger updated."

browser_assertions:
  supplier_payment:
    - "Payment saved (201 + response returned)."
    - "Supplier running balance decreased by the paid amount."
    - "Statement Of Account shows the new PaymentMade transaction."
    - "Outstanding Balance reflects the updated (reduced) balance."
    - "A JournalEntry with SourceType=SupplierPayment eventually exists."
    - "Trial Balance / journal remains balanced (debits == credits)."
    - "Exactly one payment and one journal per idempotency key on replay."
  customer_payment:
    - "Sale succeeds."
    - "Customer ledger updated with a PaymentReceived credit."
    - "No standalone customer payment record exists."
  statement_of_account:
    - "Running balance updated after transactions."
    - "Opening balance preserved in the summary."
    - "Transactions are visible and ordered."
  outstanding_balance:
    - "Outstanding reflects the party sub-ledger balance."
    - "Only parties with non-zero balances appear."

negative_tests:
  - "Supplier payment Amount <= 0 -> 400 (must be greater than zero)."
  - "Supplier payment for missing/deleted supplier -> 404."
  - "Supplier payment missing Idempotency-Key header -> 400."
  - "Supplier payment duplicate Idempotency-Key (same body) -> idempotent replay, no duplicate ledger entry or journal."
  - "Supplier payment re-POST key with divergent payload -> conflict/short-circuit (no new mutation)."
  - "Supplier payment PaymentMethod = Credit -> 400 (concrete funding method required)."
  - "Supplier payment PaymentMethod = Mixed -> 400 (concrete funding method required)."
  - "Supplier payment with inactive funding account -> 400 ACCOUNT_INACTIVE."
  - "Supplier payment with insufficient funds -> 400 INSUFFICIENT_FUNDS."
  - "Supplier payment by Cash with no cashbox configured -> 400 NO_CASHBOX_CONFIGURED."
  - "Adjustment with invalid AdjustmentType -> 400."
  - "Adjustment Amount <= 0 -> 400."
  - "Standalone Customer Payment API (POST /Payments/receive) should NOT exist (expect 404/405)."
  - "Standalone Supplier Payment API (POST /Payments/make) should NOT exist (expect 404/405)."
  - "Payment history API (GET /Payments/customer/{id}, /Payments/supplier/{id}) should NOT exist."
  - "Payment Allocation UI/endpoint should NOT exist."
  - "Party-payment Settlement should NOT exist."
  - "Reverse Payment should NOT exist."
  - "Delete Payment should NOT exist."
  - "Update Payment should NOT exist."

critical_invariants:
  - "General Ledger owns financial truth."
  - "Party Ledger (AccountLedgers) owns receivable/payable history."
  - "Statement Of Account is read-only."
  - "Outstanding Balance is read-only."
  - "Party Balance (Customer/Supplier.Balance) is a cache, never financial truth."
  - "Supplier Payment always posts through the Accounting Outbox."
  - "Supplier Payment always reaches FinancialPostingService (via CommerceAccountingService)."
  - "Customer Payment never creates a SupplierPayment entity."
  - "Customer Payment never uses a standalone payment endpoint."
  - "One Supplier Payment produces exactly one JournalEntry."
  - "Every posted journal must remain balanced (debits == credits)."
  - "Idempotency prevents duplicate posting."
  - "Tenant isolation is enforced on every read and write."
  - "No unified Payment aggregate is assumed."
  - "No invoice allocation is assumed."
  - "No settlement is assumed."

browser_test_scenarios:
  - "Supplier Payment (happy path)"
  - "Supplier Payment Idempotency (duplicate key replay)"
  - "Supplier Payment Journal Verification (Dr 2010 / Cr funding, balanced)"
  - "Supplier Payment Outstanding Verification"
  - "Supplier Payment Statement Verification"
  - "Supplier Payment negative: Amount <= 0"
  - "Supplier Payment negative: Credit method"
  - "Supplier Payment negative: Mixed method"
  - "Supplier Payment negative: insufficient funds"
  - "Supplier Payment negative: inactive funding account"
  - "Supplier Payment negative: missing idempotency key"
  - "Customer Payment During Sale (inline)"
  - "Customer Payment No-Entity Verification (no standalone record/API)"
  - "Party Ledger Adjustment (happy path)"
  - "Outstanding Balance Verification"
  - "Statement Of Account Verification"
  - "Journal Balance Verification (trial balance remains balanced)"
  - "Non-existence: /Payments/receive and /Payments/make return 404/405"

success_definition:
  - "Business rules hold (idempotency, concrete method, valid party, positive amount, tenant isolation)."
  - "Browser assertions succeed for the implemented flows."
  - "Critical invariants remain intact (GL is truth; SOA/Outstanding read-only; party balance is cache)."
  - "Supplier Payment updates the Party Ledger."
  - "Supplier Payment reaches the Accounting Outbox."
  - "Supplier Payment reaches FinancialPostingService."
  - "A JournalEntry exists for the Supplier Payment."
  - "Statement Of Account is updated."
  - "Outstanding Balance is updated."
  - "Customer Payment remains inline-at-sale only."
  - "No Payment aggregate is assumed."
  - "No allocation is assumed."
  - "No settlement is assumed."
  - "Trial Balance remains balanced (debits == credits)."
